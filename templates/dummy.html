<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% block title %}
    <title>Dummy</title>
    {% endblock %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div class="mb-4 ">
    <nav class="navbar navbar-expand-lg bg-success">
        <a href="{% url 'admin:index' %}" class="text-white bg-dark navbar-brand">Admin</a>
       <a href="{% url 'registration' %}" class="text-white bg-dark navbar-brand">Registration</a>
       
       <a href="{% url 'home' %}" class="text-white bg-dark navbar-brand">Home</a>
       {% if user.is_authenticated %}
       <a href="{% url 'user_logout' %}" class="text-white bg-dark navbar-brand">user_logout</a>
       {% else %}
       <a href="{% url 'user_login' %}" class="text-white bg-dark navbar-brand">user_login</a>
       {% endif %}
    </nav>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</div>
{% block body_block %}
{% endblock %}

</body>
</html>
